<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RayShopee QR Code</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; text-align: center; padding: 40px; background: #111; color: #fff; }
    h1 { margin-bottom: 10px; }
    .url { color: #00ff88; word-break: break-all; font-size: 14px; margin: 20px 0; }
    canvas { margin: 30px auto; display: block; }
    .btn { background: #00ff88; color: #000; padding: 15px 30px; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 20px; margin: 10px; }
  </style>
</head>
<body>
  <h1>RayShopee</h1>
  <div class="url">http://64.181.161.232:3003</div>
  <canvas id="qrcode"></canvas>
  <br>
  <a id="download" class="btn">Baixar PNG</a>
  <script>
    const url = 'http://64.181.161.232:3003';
    QRCode.toCanvas(document.getElementById('qrcode'), url, { width: 300, margin: 2, color: { dark: '#00ff88', light: '#111' } }, function (error) {
      if (error) console.error(error);
      const canvas = document.getElementById('qrcode');
      const downloadBtn = document.getElementById('download');
      downloadBtn.href = canvas.toDataURL('image/png');
      downloadBtn.download = 'rayshopee-qrcode.png';
    });
  </script>
</body>
</html>
